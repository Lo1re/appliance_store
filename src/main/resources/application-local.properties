spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/demo

logging.level.com.epam.rd.autocode.assessment.appliances=DEBUG

# Local web traffic is HTTPS; authentication and CSRF cookies are always Secure.
store.security.cookies.secure=true

# Local Mailpit only. No external mail provider or credentials.
store.mail.enabled=true
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.properties.mail.debug=false
store.mail.from=appliance-store@example.test
store.mail.base-url=https://localhost:8443

# Suppress rapid duplicate recovery requests for the same email.
store.security.password-reset.cooldown-seconds=60

# Public client signup; staff accounts stay in the protected employee-management flow.
store.registration.enabled=true

# IDE Run starts Mailpit; keep it running across application restarts.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.skip.in-tests=true
spring.docker.compose.readiness.timeout=90s


# Run scripts/setup-local-https.ps1 once. The private key/password are never committed.
server.address=127.0.0.1
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE:file:./config/certs/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=appliance-store
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=none
store.https.redirect-enabled=true
store.https.http-port=8080
store.https.public-origin=https://localhost:8443
store.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://localhost:8443/login/oauth2/code/google}

# HSTS is disabled only for local/test loopback hosts shared with HTTP developer services.
store.security.hsts.enabled=false
