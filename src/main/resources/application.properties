spring.application.name=appliance-store

server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

logging.file.name=logs/store.log

store.pagination.page-size=10

store.security.auth-mode=database

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
store.security.sessions.maximum=2
store.security.login.max-failures=5
store.security.login.window=15m
store.security.login.lock-duration=15m
store.security.login.retention=24h
store.security.login.cleanup-interval-ms=3600000

# Expected constraint races are handled by the application; do not print raw SQL values.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

store.api.enabled=false
store.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
store.security.jwt.issuer=appliance-store
store.security.jwt.audience=appliance-store-api
store.security.jwt.ttl=15m
store.security.jwt.clock-skew=30s

store.api.token-transport=cookie
store.security.cookies.secure=true

# One browser login for the website and cookie-mode API.
store.security.web-auth=jwt

store.security.refresh.ttl=7d
store.security.refresh.retention=8d
store.security.refresh.cleanup-interval-ms=3600000

# Email/reset endpoints are opt-in; local uses Mailpit.
store.mail.enabled=false

# Explicit opt-in; values stay in the launch environment, never in Git.
store.security.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
store.security.google.client-id=${GOOGLE_CLIENT_ID:}
store.security.google.client-secret=${GOOGLE_CLIENT_SECRET:}
store.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

store.registration.enabled=false
