spring.application.name=appliance-store

server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

logging.file.name=logs/store.log

store.pagination.page-size=10

store.security.auth-mode=database

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
store.security.sessions.maximum=2
store.security.login.max-failures=5
store.security.login.window=15m
store.security.login.lock-duration=15m
store.security.login.retention=24h
store.security.login.cleanup-interval-ms=3600000

# Expected constraint races are handled by the application; do not print raw SQL values.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
