<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <title th:text="#{order.header.list}">
            Orders
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content">
            <h1 th:text="#{order.header.list}">
                Orders
            </h1>
            <p th:if="${errorKey != null}" role="alert" th:text="#{${errorKey}}">
            </p>
            <p class="list-create">
                <a th:href="@{/orders/add}" th:text="#{order.btn.new}">
                    New order
                </a>
            </p>
            <form th:action="@{/orders}" method="get">
                <label for="status" th:text="#{order.field.status}">
                    Status
                </label>
                <select id="status" name="status">
                    <option value="all" th:selected="${status == 'all'}"
                    th:text="#{order.status.all}">
                        All
                    </option>
                    <option value="pending" th:selected="${status == 'pending'}"
                    th:text="#{order.status.pending}">
                        Pending
                    </option>
                    <option value="approved" th:selected="${status == 'approved'}"
                    th:text="#{order.status.approved}">
                        Approved
                    </option>
                </select>
                <label for="sort" th:text="#{list.sort}">
                    Sort by
                </label>
                <select id="sort" name="sort">
                    <option value="id" th:selected="${sort == 'id'}">
                        ID
                    </option>
                    <option value="approved" th:selected="${sort == 'approved'}"
                    th:text="#{order.field.status}">
                        Status
                    </option>
                </select>
                <button type="submit" th:text="#{order.filter.apply}">
                    Apply
                </button>
            </form>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">
                                ID
                            </th>
                            <th scope="col" th:text="#{order.field.client}">
                                Client
                            </th>
                            <th scope="col" th:text="#{order.field.employee}">
                                Employee
                            </th>
                            <th scope="col" th:text="#{order.field.status}">
                                Status
                            </th>
                            <th scope="col" th:text="#{list.actions}">
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${orders.content}">
                            <td th:text="${entry.id()}">
                            </td>
                            <td th:text="${entry.clientName()}">
                            </td>
                            <td th:text="${entry.employeeName() != null ? entry.employeeName() : '—'}">
                            </td>
                            <td>
                                <span class="status-badge" th:classappend="${entry.approved()} ? 'approved' : 'pending'" th:text="${entry.approved()} ? #{order.status.approved} : #{order.status.pending}">
                                    Pending
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/orders/{id}(id=${entry.id()})}"
                                th:text="#{order.btn.details}">
                                    Details
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="empty-state" th:if="${orders.empty}" th:text="#{order.empty}">
                No orders found.
            </p>
            <nav class="pagination" th:if="${orders.hasPrevious() or orders.hasNext()}">
                <a th:if="${orders.hasPrevious()}"
                th:href="@{/orders(status=${status},sort=${sort},page=${orders.number - 1})}"
                th:text="#{list.previous}">
                    Previous
                </a>
                <a th:if="${orders.hasNext()}"
                th:href="@{/orders(status=${status},sort=${sort},page=${orders.number + 1})}"
                th:text="#{list.next}">
                    Next
                </a>
            </nav>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
