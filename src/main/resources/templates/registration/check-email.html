<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <title th:text="#{registration.check.title}">
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content" class="auth-page">
            <h1 th:text="#{registration.check.title}">
            </h1>
            <p role="status" th:text="#{registration.check.message}">
            </p>
            <p th:text="#{registration.check.browser}">
            </p>
            <a th:href="@{/register}" th:text="#{registration.again}">
            </a>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
