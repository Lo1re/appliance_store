<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <meta name="referrer" content="no-referrer">
        <title th:text="#{registration.title}">
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content" class="auth-page">
            <h1 th:text="#{registration.title}">
            </h1>
            <p th:text="#{registration.description}">
            </p>
            <p th:if="${param.invalid != null}" role="alert" th:text="#{registration.invalid}">
            </p>
            <p th:data-retry-seconds="${retryAfterSeconds}" th:data-retry-template="#{ui.retry.template}" th:data-retry-ready="#{ui.retry.ready}" th:if="${retryAfterSeconds != null}" role="alert" th:text="#{password.forgot.retry(${retryAfterSeconds})}">
            </p>
            <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}" role="alert">
                </p>
                <div>
                    <label for="name" th:text="#{account.field.name}">
                    </label>
                    <input id="name" th:errorclass="field-error" th:field="*{name}" autocomplete="name" maxlength="100" required>
                    <p th:errors="*{name}" role="alert">
                    </p>
                </div>
                <div>
                    <label for="email" th:text="#{account.field.email}">
                    </label>
                    <input id="email" th:errorclass="field-error" th:field="*{email}" type="email" autocomplete="email" maxlength="254" required>
                    <p th:errors="*{email}" role="alert">
                    </p>
                </div>
                <div>
                    <label for="card" th:text="#{client.field.card}">
                    </label>
                    <input id="card" th:errorclass="field-error" th:field="*{card}" maxlength="32">
                    <p th:errors="*{card}" role="alert">
                    </p>
                </div>
                <div>
                    <label for="newPassword" th:text="#{account.field.password}">
                    </label>
                    <input th:data-show="#{ui.password.show}" th:data-hide="#{ui.password.hide}" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required data-password-rules aria-describedby="password-requirements">
                    <div id="password-requirements">
                        <th:block th:replace="~{fragments/password-rules :: rules}">
                        </th:block>
                    </div>
                    <p th:errors="*{newPassword}" role="alert">
                    </p>
                </div>
                <div>
                    <label for="confirmPassword" th:text="#{password.confirm.label}">
                    </label>
                    <input th:data-show="#{ui.password.show}" th:data-hide="#{ui.password.hide}" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
                    <p th:errors="*{confirmPassword}" role="alert">
                    </p>
                </div>
                <button type="submit" th:text="#{registration.submit}">
                </button>
            </form>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
