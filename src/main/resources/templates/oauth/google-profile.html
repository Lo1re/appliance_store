<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <meta name="referrer" content="no-referrer">
        <title th:text="#{google.profile.title}">
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content" class="auth-page">
            <h1 th:text="#{google.profile.title}">
                Complete your profile
            </h1>
            <p th:text="#{google.profile.description}">
            </p>
            <p th:if="${verificationSent == true}" role="status" th:text="#{google.verify.sent}">
            </p>
            <p th:if="${param.verified != null}" role="status" th:text="#{google.verify.completed}">
            </p>
            <p th:data-retry-seconds="${retryAfterSeconds}" th:data-retry-template="#{ui.retry.template}" th:data-retry-ready="#{ui.retry.ready}" th:if="${retryAfterSeconds != null}" role="alert" th:text="#{password.forgot.retry(${retryAfterSeconds})}">
            </p>
            <form th:action="@{/onboarding/google}" th:object="${googleProfile}" method="post">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}" role="alert">
                </p>
                <div>
                    <label for="name" th:text="#{account.field.name}">
                    </label>
                    <input id="name" th:errorclass="field-error" th:field="*{name}" maxlength="100" autocomplete="name" required>
                    <p th:errors="*{name}" role="alert">
                    </p>
                </div>
                <div>
                    <label for="email" th:text="#{account.field.email}">
                    </label>
                    <input id="email" th:errorclass="field-error" th:field="*{email}" type="email" maxlength="254" autocomplete="email" required>
                    <p th:errors="*{email}" role="alert">
                    </p>
                </div>
                <div>
                    <label for="card" th:text="#{client.field.card}">
                    </label>
                    <input id="card" th:errorclass="field-error" th:field="*{card}" maxlength="32">
                    <p th:errors="*{card}" role="alert">
                    </p>
                </div>
                <button type="submit" th:text="#{google.profile.continue}">
                    Continue
                </button>
            </form>
            <form th:action="@{/onboarding/google/cancel}" method="post">
                <button type="submit" th:text="#{google.cancel}">
                    Cancel
                </button>
            </form>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
