<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <title th:text="#{google.account.title}">
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content" class="auth-page">
            <h1 th:text="#{google.account.title}">
                Google account
            </h1>
            <p th:if="${googleLinked}" role="status" th:text="#{google.link.completed}">
            </p>
            <th:block th:unless="${googleLinked}">
                <p th:text="#{google.link.description}">
                </p>
                <form th:action="@{/account/google/link}" method="post">
                    <button type="submit" th:text="#{google.link.submit}">
                        Link Google
                    </button>
                </form>
            </th:block>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
