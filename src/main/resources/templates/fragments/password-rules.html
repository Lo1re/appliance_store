<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="rules" class="password-rules">
            <p class="form-note" th:text="#{ui.password.requirements}">
            </p>
            <ul>
                <li data-password-rule="length" th:text="#{user.password.too-short}">
                </li>
                <li data-password-rule="uppercase" th:text="#{user.password.uppercase}">
                </li>
                <li data-password-rule="lowercase" th:text="#{user.password.lowercase}">
                </li>
                <li data-password-rule="digit" th:text="#{user.password.digit}">
                </li>
                <li data-password-rule="special" th:text="#{user.password.special}">
                </li>
            </ul>
        </div>
    </body>
</html>
