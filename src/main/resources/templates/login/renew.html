<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.renew.title}">Continue sign-in</title></head>
<body>
<header th:insert="~{menunavy :: navy}"></header>
<main><h1 th:text="#{login.renew.title}">Continue sign-in</h1>
    <p th:text="#{login.renew.description}">Continue securely or sign in again.</p>
    <form th:action="@{/auth/renew}" method="post">
        <button type="submit" th:text="#{login.renew.submit}">Continue</button>
    </form>
    <a th:href="@{/login}" th:text="#{nav.login}">Sign in</a>
</main></body></html>
