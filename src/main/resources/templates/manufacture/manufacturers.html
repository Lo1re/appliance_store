<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <title th:text="#{manufacturer.header.list}">
            Manufacturers
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content">
            <h1 th:text="#{manufacturer.header.list}">
                Manufacturers
            </h1>
            <p th:if="${errorKey != null}" role="alert" th:text="#{${errorKey}}">
            </p>
            <form th:action="@{/manufacturers}" method="get">
                <label for="search" th:text="#{list.search}">
                    Search
                </label>
                <input id="search" name="search" type="search" maxlength="100" th:value="${search}">
                <label for="sort" th:text="#{list.sort}">
                    Sort by
                </label>
                <select id="sort" name="sort">
                    <option value="name" th:selected="${sort == 'name'}"
                    th:text="#{object.manufacturer.name}">
                        Name
                    </option>
                    <option value="id" th:selected="${sort == 'id'}">
                        ID
                    </option>
                </select>
                <button type="submit" th:text="#{list.search}">
                    Search
                </button>
            </form>
            <p class="list-create" th:if="${canManage}">
                <a th:href="@{/manufacturers/add}" th:text="#{manufacturer.btn.new}">
                    New manufacturer
                </a>
            </p>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">
                                ID
                            </th>
                            <th scope="col" th:text="#{object.manufacturer.name}">
                                Name
                            </th>
                            <th scope="col" th:if="${canManage}" th:text="#{list.actions}">
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="manufacturer : ${manufacturers.content}">
                            <td th:text="${manufacturer.id}">
                            </td>
                            <td th:text="${manufacturer.name}">
                            </td>
                            <td th:if="${canManage}">
                                <a th:href="@{/manufacturers/{id}/edit(id=${manufacturer.id})}"
                                th:text="#{form.edit}">
                                    Edit
                                </a>
                                <form th:data-confirm="#{ui.delete.confirm}" th:action="@{/manufacturers/{id}/delete(id=${manufacturer.id})}"
                                method="post">
                                    <button class="button-danger" type="submit" th:text="#{form.delete}">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="empty-state" th:if="${manufacturers.empty}" th:text="#{manufacturer.empty}">
                No manufacturers found.
            </p>
            <nav class="pagination" th:if="${manufacturers.totalPages > 1}">
                <a th:if="${manufacturers.hasPrevious()}"
                th:href="@{/manufacturers(search=${search},sort=${sort},page=${manufacturers.number - 1})}"
                th:text="#{list.previous}">
                    Previous
                </a>
                <span th:text="|${manufacturers.number + 1} / ${manufacturers.totalPages}|">
                </span>
                <a th:if="${manufacturers.hasNext()}"
                th:href="@{/manufacturers(search=${search},sort=${sort},page=${manufacturers.number + 1})}"
                th:text="#{list.next}">
                    Next
                </a>
            </nav>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
