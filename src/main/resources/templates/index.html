<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <title th:text="#{shop.name}">
        </title>
        <th:block th:replace="~{fragments/assets :: assets}">
        </th:block>
    </head>
    <body>
        <header th:insert="~{menunavy :: navy}">
        </header>
        <main id="main-content" class="home-page">
            <section class="hero">
                <div class="hero-copy">
                    <span class="eyebrow" th:text="#{ui.hero.eyebrow}">
                    </span>
                    <h1 th:text="#{ui.hero.title}">
                        A little upgrade. A better every day.
                    </h1>
                    <p th:text="#{home.description}">
                    </p>
                    <div class="hero-actions">
                        <a class="button" th:if="${navigation.signedIn()}" th:href="@{/appliances}" th:text="#{home.open-catalog}">
                        </a>
                        <a class="button" th:unless="${navigation.signedIn()}" th:href="@{/login}" th:text="#{nav.login}">
                        </a>
                        <a th:if="${registrationEnabled and !navigation.signedIn()}" th:href="@{/register}" th:text="#{registration.title}">
                        </a>
                        <a th:if="${navigation.signedIn()}" th:href="@{/orders}" th:text="#{order.header.list}">
                        </a>
                    </div>
                </div>
                <div class="hero-art hero-products">
                    <span class="art-circle"></span>
                    <img class="hero-laptop" th:src="@{/images/catalog/apple-macbook-pro-14/1.webp}" alt="Apple MacBook Pro 14" width="540" height="400">
                    <img class="hero-phone" th:src="@{/images/catalog/apple-iphone-13-pro/1.webp}" alt="Apple iPhone 13 Pro" width="230" height="300">
                </div>
            </section>
            <section class="home-section" th:if="${featured != null and !featured.empty}">
                <div class="section-heading"><span class="eyebrow" th:text="#{ui.featured.eyebrow}"></span><h2 th:text="#{ui.featured.title}"></h2></div>
                <section th:replace="~{fragments/products :: cards(${featured}, false)}"></section>
            </section>
            <section class="home-section">
                <div class="section-heading">
                    <span class="eyebrow" th:text="#{ui.explore}">
                    </span>
                    <h2 th:text="#{ui.home.title}">
                    </h2>
                </div>
                <div class="feature-grid">
                    <a class="feature-card" th:href="${navigation.signedIn()} ? @{/appliances} : @{/login}">
                        <span class="feature-icon" aria-hidden="true">
                            ▦
                        </span>
                        <h3 th:text="#{appliance.header.list}">
                        </h3>
                        <p th:text="#{ui.feature.catalog}">
                        </p>
                        <span class="card-arrow" aria-hidden="true">
                            ↗
                        </span>
                    </a>
                    <a class="feature-card" th:href="${navigation.signedIn()} ? @{/manufacturers} : @{/login}">
                        <span class="feature-icon" aria-hidden="true">
                            ◎
                        </span>
                        <h3 th:text="#{manufacturer.header.list}">
                        </h3>
                        <p th:text="#{ui.feature.brands}">
                        </p>
                        <span class="card-arrow" aria-hidden="true">
                            ↗
                        </span>
                    </a>
                    <a class="feature-card" th:href="${navigation.signedIn()} ? @{/orders} : @{/login}">
                        <span class="feature-icon" aria-hidden="true">
                            ↗
                        </span>
                        <h3 th:text="#{order.header.list}">
                        </h3>
                        <p th:text="#{ui.feature.orders}">
                        </p>
                        <span class="card-arrow" aria-hidden="true">
                            ↗
                        </span>
                    </a>
                </div>
            </section>
        </main>
        <footer th:replace="~{footer :: footer}">
        </footer>
    </body>
</html>
