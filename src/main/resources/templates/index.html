<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{shop.name}">Appliance Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<header th:insert="~{menunavy :: navy}"></header>

<main class="container py-4">


    <h1 th:text="#{shop.name}">Appliance Store</h1>
    <p th:text="#{home.description}">
        Browse appliances and manage your orders.
    </p>

    <a th:if="${navigation.signedIn()}" th:href="@{/appliances}"
       th:text="#{home.open-catalog}" class="btn btn-primary">Open catalog</a>

    <a th:unless="${navigation.signedIn()}" th:href="@{/login}"
       th:text="#{nav.login}" class="btn btn-primary">Sign in</a>
</main>
</body>
</html>
