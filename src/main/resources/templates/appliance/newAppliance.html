<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? #{appliance.btn.edit} : #{appliance.btn.new}">Product</title>
</head>
<body>
<header th:insert="~{menunavy :: navy}"></header>
<main>
    <h1 th:text="${editing} ? #{appliance.btn.edit} : #{appliance.btn.new}">Product</h1>

    <form th:action="@{${formAction}}" th:object="${appliance}" method="post">
        <div>
            <label for="name" th:text="#{appliance.field.name}">Name</label>
            <input type="text" th:field="*{name}" maxlength="150">
            <p th:errors="*{name}" role="alert"></p>
        </div>

        <div>
            <label for="model" th:text="#{appliance.field.model}">Model</label>
            <input type="text" th:field="*{model}" maxlength="100">
            <p th:errors="*{model}" role="alert"></p>
        </div>

        <div>
            <label for="manufacturerId" th:text="#{appliance.field.manufacturer}">Manufacturer</label>
            <select th:field="*{manufacturerId}">
                <option value="" th:text="#{form.choose}">Choose an option</option>
                <option th:each="manufacturer : ${manufacturers}"
                        th:value="${manufacturer.id}" th:text="${manufacturer.name}"></option>
            </select>
            <p th:errors="*{manufacturerId}" role="alert"></p>
        </div>

        <div>
            <label for="category" th:text="#{appliance.field.category}">Category</label>
            <select th:field="*{category}">
                <option value="" th:text="#{form.choose}">Choose an option</option>
                <option th:each="category : ${categories}"
                        th:value="${category.name()}"
                        th:text="${#messages.msg('appliance.category.' + category.name())}"></option>
            </select>
            <p th:errors="*{category}" role="alert"></p>
        </div>

        <div>
            <label for="powerType" th:text="#{appliance.field.powerType}">Power source</label>
            <select th:field="*{powerType}">
                <option value="" th:text="#{form.choose}">Choose an option</option>
                <option th:each="type : ${powerTypes}" th:value="${type.name()}"
                        th:text="${#messages.msg('appliance.powerType.' + type.name())}"></option>
            </select>
            <p th:errors="*{powerType}" role="alert"></p>
        </div>

        <div>
            <label for="characteristic" th:text="#{appliance.field.characteristic}">Features</label>
            <textarea th:field="*{characteristic}" maxlength="1000"></textarea>
            <p th:errors="*{characteristic}" role="alert"></p>
        </div>

        <div>
            <label for="description" th:text="#{appliance.field.description}">Description</label>
            <textarea th:field="*{description}" maxlength="4000"></textarea>
            <p th:errors="*{description}" role="alert"></p>
        </div>

        <div>
            <label for="power" th:text="#{appliance.field.power}">Power (W)</label>
            <input type="number" th:field="*{power}" min="1" step="1">
            <p th:errors="*{power}" role="alert"></p>
        </div>

        <div>
            <label for="price" th:text="#{appliance.field.price}">Price</label>
            <input type="number" th:field="*{price}" min="0.01" step="0.01">
            <p th:errors="*{price}" role="alert"></p>
        </div>

        <button type="submit" th:text="#{form.save}">Save</button>
        <a th:href="@{/appliances}" th:text="#{form.cancel}">Cancel</a>
    </form>
</main>
</body>
</html>
