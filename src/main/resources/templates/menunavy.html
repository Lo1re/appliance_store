<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navy">
<nav
     th:aria-label="#{nav.main}"
     class="d-flex flex-wrap align-items-center gap-3 border-bottom p-3">

    <a th:href="@{/}" th:text="#{shop.name}" class="fw-bold">Appliance Store</a>

    <th:block th:if="${navigation.signedIn()}">
        <a th:href="@{/appliances}" th:text="#{appliance.header.list}">Products</a>
        <a th:href="@{/manufacturers}" th:text="#{manufacturer.header.list}">Manufacturers</a>
        <a th:href="@{/orders}" th:text="#{order.header.list}">Orders</a>

        <th:block th:if="${navigation.employee()}">
            <a th:href="@{/clients}" th:text="#{client.header.list}">Clients</a>
            <a th:href="@{/employees}" th:text="#{employee.header.list}">Employees</a>
        </th:block>

        <a th:if="${passwordChangeEnabled}" th:href="@{/password/change}" th:text="#{password.settings.title}">Change password</a>

        <a th:if="${googleLoginEnabled}" th:href="@{/account/google}" th:text="#{google.account.title}">Google account</a>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" th:text="#{nav.logout}">Sign out</button>
        </form>
    </th:block>

    <a th:unless="${navigation.signedIn()}"
       th:href="@{/login}" th:text="#{nav.login}">Sign in</a>
    <a th:if="${registrationEnabled and !navigation.signedIn()}" th:href="@{/register}" th:text="#{registration.title}">Create client account</a>
</nav>
<nav th:replace="~{fragments/language :: links}"></nav>
</div>
</body>
</html>
