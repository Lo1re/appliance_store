spring.datasource.url=jdbc:h2:mem:appliance-store-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver


spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/demo

logging.level.com.epam.rd.autocode.assessment.appliances=DEBUG

# Explicit HTTP exception for local/test; HTTPS requests still receive Secure cookies.
store.security.cookies.secure=false

# Explicit session mode remains for session-policy regression tests; normal launch uses JWT.
store.security.web-auth=session

# Test runs never inherit real Google registration from the launch environment.
store.security.google.enabled=false

# H2 and Testcontainers never start the development Mailpit service.
spring.docker.compose.enabled=false
